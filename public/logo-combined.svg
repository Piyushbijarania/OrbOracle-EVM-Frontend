    <path d="M 160 12 L 192 12 C 205 12 213 18 213 28 C 213 34 209 40 201 43 C 216 46 216 53 216 63 C 216 74 207 80 192 80 L 160 80 Z M 175 24 L 175 39 L 189 39 C 195 39 198 36 198 31 C 198 26 195 24 189 24 Z M 175 51 L 175 68 L 191 68 C 198 68 201 65 201 59 C 201 54 198 51 191 51 Z" fill="url(#combOrbWhiteGrad)"/>

