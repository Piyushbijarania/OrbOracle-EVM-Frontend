<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="logo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer Dotted Orbit representing Composed Node Network -->
  <circle cx="16" cy="16" r="12" stroke="white" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <!-- Rotated Elliptical Data Stream Orbit -->
  <ellipse cx="16" cy="16" rx="12" ry="5" stroke="white" stroke-width="1" opacity="0.5" transform="rotate(-30 16 16)"/>
  <!-- Central Violet Glow -->
  <circle cx="16" cy="16" r="6" fill="url(#logo-glow)"/>
  <!-- Core Oracle Point -->
  <circle cx="16" cy="16" r="2.5" fill="white"/>
  <!-- Satellite Node Junctions -->
  <circle cx="6" cy="10" r="1.2" fill="white"/>
  <circle cx="26" cy="22" r="1" fill="white"/>
</svg>
